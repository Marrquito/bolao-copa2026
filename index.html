    <meta name="theme-color" content="#0f172a" />
    <title>Bolão Copa 2026 ⚽</title>
    <script>
      // GitHub Pages SPA: restore path from 404 redirect
      ;(function() {
        var q = window.location.search
        if (q && q.startsWith('?p=')) {
          var decoded = decodeURIComponent(q.slice(3).split('&h=')[0])
          var hash = q.includes('&h=') ? '#' + decodeURIComponent(q.split('&h=')[1]) : ''
          window.history.replaceState(null, null, '/' + decoded + hash)
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
